<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson — Study Room · Trendably</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    /* Light mode (default) */
    --bg: #FFFFFF;
    --panel: #F4F9FE;
    --panel2: #EAF3FC;
    --border: #C9DCF2;
    --border-soft: #DCE9F8;
    --text1: #0B1C33;
    --text2: #33547A;
    --text3: #5A7699;
    --text4: #8CA0BC;
    --blue: #1C6FE0;
    --cyan: #0EA5C4;
    --green: #0E9F6E;
    --red: #D23A58;
    --head-grad: linear-gradient(180deg, rgba(28,111,224,0.92) 0%, rgba(14,165,196,0.5) 65%, rgba(255,255,255,0) 100%);
    --head-text: #FFFFFF;
    --nav-grad: linear-gradient(180deg, rgba(28,111,224,0.45) 0%, rgba(14,165,196,0.16) 65%, rgba(255,255,255,0.02) 100%);
    --accent-soft: rgba(28,111,224,0.07);
    --shadow: 0 12px 28px rgba(11,28,51,0.12);
    --strip-bg: #F4F9FE;
    --sky: #6FA8E8;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-mode="dark"] {
    --bg: #05080E;
    --panel: #0D1420;
    --panel2: #121A27;
    --border: #2A3850;
    --border-soft: #1C2636;
    --text1: #F3F6FB;
    --text2: #B7C0D1;
    --text3: #8593A8;
    --text4: #5B6472;
    --blue: #2F8CFF;
    --cyan: #21D4F0;
    --green: #2EE6A6;
    --red: #FF5577;
    --head-grad: linear-gradient(180deg, rgba(47,140,255,0.30) 0%, rgba(33,212,240,0.10) 70%, rgba(13,20,32,0) 100%);
    --head-text: #EAF2FF;
    --nav-grad: linear-gradient(180deg, rgba(47,140,255,0.16) 0%, rgba(33,212,240,0.05) 65%, rgba(5,8,14,0) 100%);
    --accent-soft: rgba(47,140,255,0.12);
    --shadow: 0 16px 34px rgba(0,0,0,0.5);
    --strip-bg: #0A111C;
    --sky: #8FC0FF;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--text1);
    font-family: 'Inter Tight', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* ---------- Nav ---------- */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; top: env(safe-area-inset-top, 0px);
    background: var(--nav-grad);
    backdrop-filter: blur(10px); z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px rgba(14,165,196,0.5); }
  .back { font-size: 13px; color: var(--text3); text-decoration: none; display: flex; align-items: center; gap: 5px; }
  .brand .logo { width: 28px; height: 28px; flex: none; }
  .word { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; color: var(--text1); }
  .word span { background: linear-gradient(90deg, var(--blue), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .page-tag { font-size: 12.5px; color: var(--text3); padding-left: 10px; margin-left: 2px; border-left: 1px solid var(--border); }
  .nav-actions { display: flex; align-items: center; gap: 8px; }
  .t-sun { display: none; }
  :root[data-mode="dark"] .t-sun { display: block; }
  :root[data-mode="dark"] .t-moon { display: none; }


  .menu-btn {
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border-soft); background: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text2); flex: none;
  }
  .menu-btn svg { width: 16px; height: 16px; }

  .nav-drawer {
    position: fixed; inset: 0; z-index: 50; visibility: hidden;
  }
  .nav-drawer.open { visibility: visible; }
  .nav-drawer .scrim {
    position: absolute; inset: 0; background: rgba(5,8,14,0.45);
    opacity: 0; transition: opacity 0.2s ease;
  }
  .nav-drawer.open .scrim { opacity: 1; }
  .nav-drawer .panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 78%; max-width: 300px;
    background: var(--panel); border-left: 1px solid var(--border-soft);
    padding: 20px 18px; transform: translateX(100%); transition: transform 0.25s ease;
    box-shadow: var(--shadow);
  }
  .nav-drawer.open .panel { transform: translateX(0); }
  .nav-drawer .panel h3 { font-family: 'Sora', sans-serif; font-size: 13px; color: var(--text3); font-weight: 600; margin: 0 0 14px; }
  .nav-drawer .panel a {
    display: flex; align-items: center; gap: 10px; padding: 11px 10px; border-radius: 9px;
    color: var(--text1); text-decoration: none; font-size: 14px; font-weight: 500; margin-bottom: 2px;
  }
  .nav-drawer .panel a.current { background: var(--accent-soft); color: var(--blue); font-weight: 600; }
  .nav-drawer .panel a .pg-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex: none; }
  .nav-drawer .panel a.current .pg-dot { background: var(--blue); }

  /* ---------- Explainer pop-up ---------- */
  .gl-scrim { position: fixed; inset: 0; background: rgba(5,8,14,0.45); opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 60; }
  .gl-scrim.open { opacity: 1; pointer-events: auto; }
  .gl-sheet { position: fixed; left: 50%; bottom: 0; width: min(560px, 100%); max-height: 84vh; max-height: 84dvh;
    transform: translate(-50%, 104%); transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s linear .3s;
    background: var(--bg); border: 1px solid var(--border); border-bottom: none; border-radius: 20px 20px 0 0;
    box-shadow: var(--shadow); z-index: 61; display: flex; visibility: hidden; flex-direction: column; overflow: hidden; }
  .gl-sheet.open { transform: translate(-50%, 0); visibility: visible; transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s; }
  .gl-head { flex: none; background: var(--head-grad); padding: 10px 18px 16px; position: relative; }
  .gl-grip { width: 38px; height: 4px; border-radius: 4px; background: var(--head-text); opacity: .55; margin: 0 auto 12px; }
  .gl-head h3 { font-size: 19px; font-weight: 600; color: var(--head-text); padding-right: 40px; }
  .gl-close { position: absolute; top: 18px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.18); color: var(--head-text); display: flex; align-items: center; justify-content: center; }
  .gl-body { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 6px 18px 22px; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
    * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin:0; background:var(--bg); color:var(--text1); font-family:'Inter Tight',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4 { font-family:'Sora',sans-serif; margin:0; letter-spacing:-0.02em; }
  button { font-family:inherit; cursor:pointer; }
  a { color:inherit; }
  :focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }

  /* sticky top: app nav + lesson position */
  .top { position:sticky; top:0; z-index:30; background:var(--bg); }
  .top nav { position:static; }
  .where { border-bottom:1px solid var(--border); background:var(--strip-bg); }
  .where-in { max-width:780px; margin:0 auto; padding:9px 18px 10px; }
  .crumbs { display:flex; flex-wrap:wrap; align-items:center; gap:2px 6px; font-size:12.5px; color:var(--text3); }
  .crumbs a { color:var(--blue); text-decoration:none; }
  .crumbs .sep { color:var(--text4); }
  .crumbs .here { color:var(--text2); }
  .pos-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:5px; }
  .pos-now { font-size:13.5px; color:var(--text1); font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pos-now span { color:var(--text3); font-weight:500; }
  .dots { display:flex; gap:5px; flex:none; }
  .dots button { width:22px; height:6px; border-radius:4px; border:none; padding:0; background:var(--border); }
  .dots button.done { background:var(--cyan); }
  .dots button.now { background:var(--blue); }
  .dots button.now.done { background:linear-gradient(90deg,var(--blue),var(--cyan)); }

  .wrap { max-width:780px; margin:0 auto; padding:0 18px 110px; }

  .lesson-head { padding:26px 2px 18px; }
  .lesson-head .kicker { font-size:12.5px; color:var(--text3); }
  .lesson-head h1 { font-size:22px; font-weight:600; margin-top:6px; }
  .lesson-head p { font-size:15px; color:var(--text2); line-height:1.6; margin:8px 0 0; max-width:58ch; }

  .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:20px; margin-bottom:18px; scroll-margin-top:140px; }
  .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:-20px -20px 16px; padding:15px 20px; border-radius:15px 15px 0 0; background:var(--head-grad); }
  .section-head h2 { font-size:17px; font-weight:600; color:var(--head-text); }
  .section-head .n { font-size:12.5px; color:var(--head-text); opacity:.8; white-space:nowrap; }

  .read p { font-size:15px; line-height:1.65; color:var(--text1); margin:0 0 12px; max-width:62ch; }
  .read p.aside { color:var(--text2); }

  /* app snapshot */
  .snap { margin:16px 0 6px; border:1px solid var(--border); border-radius:12px; background:var(--bg); overflow:hidden; }
  .snap-bar { display:flex; align-items:center; gap:7px; padding:7px 12px; font-size:11.5px; color:var(--text3); background:var(--panel2); border-bottom:1px solid var(--border-soft); }
  .snap-bar svg { flex:none; }
  .snap-body { padding:12px 14px; overflow-x:auto; }
  .snap-cap { font-size:12.5px; color:var(--text3); line-height:1.5; margin:6px 2px 0; }
  .pos { color:var(--green); } .neg { color:var(--red); }

  .s-strip { display:flex; gap:18px; font-size:12.5px; color:var(--text3); white-space:nowrap; }
  .s-strip b { font-weight:600; }
  .s-strip .hl { padding:3px 8px; margin:-3px -8px; border-radius:7px; background:var(--accent-soft); outline:1px solid var(--blue); color:var(--text1); }

  .s-grid-h { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .s-grid-h b { font-family:'Sora',sans-serif; font-size:15px; }
  .s-grid-h span { font-size:12px; color:var(--text3); }
  .s-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .s-chips span { font-size:11.5px; padding:4px 9px; border-radius:20px; border:1px solid var(--border); color:var(--text2); background:var(--panel); }

  .s-bars { display:grid; gap:6px; min-width:260px; }
  .s-bar { display:grid; grid-template-columns:118px 1fr 34px; align-items:center; gap:10px; font-size:12px; color:var(--text2); }
  .s-bar i { display:block; height:8px; border-radius:4px; background:linear-gradient(90deg,var(--blue),var(--cyan)); }
  .s-bar em { font-style:normal; text-align:right; color:var(--text1); font-weight:600; }
  .s-bar.big { color:var(--text1); font-weight:600; }

  .s-quote { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; }
  .s-quote .nm { font-size:12.5px; color:var(--text3); width:100%; }
  .s-quote .lvl { font-family:'Sora',sans-serif; font-size:24px; font-weight:600; }
  .s-quote .chg { font-size:14px; font-weight:600; }
  .s-quote .chg u { text-decoration:none; padding:2px 6px; border-radius:6px; background:var(--accent-soft); }
  .s-legend { display:flex; gap:16px; margin-top:8px; font-size:11.5px; color:var(--text3); }

  .s-moves { display:grid; gap:2px; min-width:240px; }
  .s-move { display:flex; justify-content:space-between; font-size:12.5px; padding:6px 2px; border-bottom:1px solid var(--border-soft); color:var(--text2); }
  .s-move:last-child { border-bottom:none; }
  .s-move b { font-weight:600; }
  .s-move.idx { color:var(--text1); font-weight:600; background:var(--accent-soft); border-radius:7px; padding:6px 8px; margin-top:4px; border-bottom:none; }

  /* common mistake */
  .mistake { margin:16px 0 0; padding:12px 14px; border-radius:10px; background:var(--panel2); border-left:3px solid var(--red); }
  .mistake h4 { font-size:13px; font-weight:600; color:var(--text1); margin-bottom:4px; }
  .mistake p { font-size:14px; line-height:1.6; color:var(--text2); margin:0; }

  /* check */
  .check { margin-top:18px; padding-top:16px; border-top:1px solid var(--border-soft); }
  .check h4 { font-size:13px; font-weight:600; color:var(--text3); margin-bottom:6px; }
  .check .q { font-size:15.5px; line-height:1.55; font-weight:500; margin:0 0 12px; max-width:60ch; }
  .opts { display:grid; gap:8px; }
  .opt { text-align:left; display:flex; gap:11px; align-items:flex-start; width:100%; padding:12px 14px; border-radius:11px; border:1px solid var(--border); background:var(--bg); color:var(--text1); font-size:14.5px; line-height:1.5; }
  .opt:hover:not(:disabled) { border-color:var(--blue); }
  .opt .mk { flex:none; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--border); margin-top:1px; display:flex; align-items:center; justify-content:center; }
  .opt.wrong { border-color:var(--red); background:color-mix(in srgb,var(--red) 7%,var(--bg)); }
  .opt.wrong .mk { border-color:var(--red); background:var(--red); }
  .opt.right { border-color:var(--green); background:color-mix(in srgb,var(--green) 9%,var(--bg)); }
  .opt.right .mk { border-color:var(--green); background:var(--green); }
  .opt .mk svg { display:none; width:12px; height:12px; color:#fff; }
  .opt.right .mk .ok, .opt.wrong .mk .no { display:block; }
  .opt:disabled { cursor:default; }
  .opts.solved .opt:not(.right) { opacity:.55; }
  .fb { font-size:14px; line-height:1.6; margin:10px 0 0; padding:10px 12px; border-radius:9px; }
  .fb.no { background:color-mix(in srgb,var(--red) 8%,transparent); color:var(--text1); }
  .fb.yes { background:color-mix(in srgb,var(--green) 10%,transparent); color:var(--text1); }
  .fb b { font-weight:600; }

  .after { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; }
  .explore { display:flex; flex-wrap:wrap; gap:8px; }
  .explore span { font-size:12.5px; color:var(--text3); width:100%; }
  .ask { font-size:13px; padding:7px 12px; border-radius:20px; border:1px solid var(--border); background:var(--accent-soft); color:var(--blue); }
  .ask:hover { border-color:var(--blue); }
  .next { display:none; border:none; border-radius:11px; padding:11px 18px; font-size:14px; font-weight:600; color:#fff; background:linear-gradient(135deg,var(--blue),var(--cyan)); }
  .card.solved .next { display:inline-flex; }

  /* recap */
  .recap ol { margin:0; padding-left:20px; }
  .recap li { font-size:14.5px; line-height:1.6; color:var(--text1); margin-bottom:8px; }
  .recap li::marker { color:var(--blue); font-weight:600; }
  .recap .status { font-size:13px; color:var(--text3); margin:4px 0 14px; }
  .recap .row { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .btn2 { display:inline-flex; align-items:center; border-radius:11px; padding:11px 16px; font-size:14px; font-weight:600; text-decoration:none; border:1px solid var(--border); color:var(--text1); background:var(--bg); }
  .btn2.pri { border:none; color:#fff; background:linear-gradient(135deg,var(--blue),var(--cyan)); }

  /* tutor launcher */
  .tutor-btn { position:fixed; right:16px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:40; display:flex; align-items:center; gap:8px; padding:12px 16px; border-radius:30px; border:none; color:#fff; font-size:14px; font-weight:600; background:linear-gradient(135deg,var(--blue),var(--cyan)); box-shadow:0 10px 26px rgba(28,111,224,.35); }
  .tutor-btn svg { width:18px; height:18px; }

  /* tutor sheet (same pattern as the glossary pop-up) */
  .gl-sheet { height:78vh; height:78dvh; }
  .gl-head .ctx { font-size:12.5px; color:var(--head-text); opacity:.85; margin-top:4px; padding-right:40px; }
  .chat { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:86%; font-size:14.5px; line-height:1.55; padding:10px 13px; border-radius:14px; white-space:pre-wrap; }
  .msg.me { align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:4px; }
  .msg.tu { align-self:flex-start; background:var(--panel); border:1px solid var(--border-soft); color:var(--text1); border-bottom-left-radius:4px; }
  .msg.tu.wait { color:var(--text3); }
  .chat-note { font-size:12px; color:var(--text4); text-align:center; line-height:1.5; padding:0 8px; }
  .starters { display:flex; flex-wrap:wrap; gap:8px; }
  .composer { flex:none; display:flex; gap:8px; padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--border); background:var(--panel); }
  .composer textarea { flex:1; resize:none; height:44px; max-height:110px; border-radius:12px; border:1px solid var(--border); background:var(--bg); color:var(--text1); font:inherit; font-size:15px; padding:11px 12px; outline:none; }
  .composer textarea:focus { border-color:var(--blue); }
  .composer button { flex:none; width:44px; height:44px; border-radius:12px; border:none; color:#fff; background:linear-gradient(135deg,var(--blue),var(--cyan)); display:flex; align-items:center; justify-content:center; }
  .composer button:disabled { opacity:.5; }

  @media (max-width:520px){
    .page-tag { display:none; }
    .s-bar { grid-template-columns:104px 1fr 32px; }
    .dots button { width:16px; }
  }
  @media (prefers-reduced-motion:reduce){ * { transition:none!important; scroll-behavior:auto!important; } }

.s-empty{padding:18px;text-align:center;color:var(--text3);font-size:13px;border:1px dashed var(--border);border-radius:10px}
</style>
</head>

<div class="top" id="top">
<nav>
  <a class="brand" href="index.html" aria-label="Trendably home">

      var right=!!o.correct;
      b.classList.add(right?'right':'wrong'); b.disabled=true;
      if(!silent) fb.innerHTML='<p class="fb '+(right?'yes':'no')+'">'+(right?'':'<b>Not quite.</b> ')+T(o.feedback)+(right?'':' Try another answer.')+'</p>';
      if(right){
        opts.classList.add('solved'); [].forEach.call(opts.children,function(x){x.disabled=true;});
        card.classList.add('solved');
        if(silent) fb.innerHTML='<p class="fb yes">'+T(o.feedback)+'</p>';
        if(st.done.indexOf(i)<0){ st.done.push(i); save(); }
        paint();
      }
    }
    $('concepts').addEventListener('click',function(e){
      var o=e.target.closest('.opt'); if(o&&!o.disabled){ solve(o.closest('.card'),+o.dataset.k); return; }
      var a=e.target.closest('.ask'); if(a){ openTutor(a.dataset.q); return; }
      var n=e.target.closest('[data-go]'); if(n){ goTo(+n.dataset.go); }
    });
    $('dots').addEventListener('click',function(e){ var n=e.target.closest('[data-go]'); if(n) goTo(+n.dataset.go); });
    function goTo(i){ var el=$('c'+i); if(!el) return; var top=el.getBoundingClientRect().top+window.scrollY-$('top').offsetHeight-12; window.scrollTo({top:top,behavior:'smooth'}); }

    function paint(){
      [].forEach.call($('dots').children,function(d,i){ d.classList.toggle('done',st.done.indexOf(i)>=0); d.classList.toggle('now',i===cur); });
      var c=C[Math.min(cur,N-1)];
      $('posNow').innerHTML= cur>=N ? 'Lesson recap <span>· '+st.done.length+' of '+N+' concepts checked</span>' : 'Concept '+(cur+1)+' of '+N+' <span>· '+c.title+'</span>';
      $('recapStatus').textContent = st.done.length===N ? 'All '+N+' concepts checked.' : st.done.length+' of '+N+' concepts checked. You can go back to any of them using the bars at the top.';
      $('tCtx').textContent = cur>=N ? L.title+' · lesson recap' : 'Concept '+(cur+1)+' · '+c.title;
    }
    st.done.slice().forEach(function(i){ var card=$('c'+i); if(card) solve(card,correctIndex(i),true); });
    function onScroll(){
      var line=$('top').offsetHeight+window.innerHeight*0.3, n=0;
      for(var i=0;i<=N;i++){ var el=$('c'+i); if(el.getBoundingClientRect().top<line) n=i; }
      if(n!==cur){ cur=n; if(cur<N){ st.at=cur; save(); } paint(); }
    }
    window.addEventListener('scroll',onScroll,{passive:true});
    paint();
    if(st.at>0){ setTimeout(function(){ goTo(st.at); },60); }

    /* ---------- tutor ---------- */
    var sample=null, busy=false, history=[];
    if(window.claude&&window.claude.use){ window.claude.use('sample').then(function(s){ sample=s; if(!s) offline(); }).catch(offline); } else offline();
    function offline(){ $('tNote').textContent='Preview: the tutor gives sample replies here. In the app it answers live.'; }
    function sys(){
      var c=C[Math.min(cur,N-1)];
      return 'You are the tutor inside the Trendably Study Room, talking with a learner.\n'+
        'Tier: '+L.tier.title+'. Chapter: '+L.chapter.title+'. Lesson: '+L.title+' ('+N+' concepts: '+C.map(function(x){return x.title;}).join('; ')+').\n'+
        'The learner is reading concept '+(Math.min(cur,N-1)+1)+': "'+c.title+'". Its text: '+c.read.map(T).join(' ')+'\n'+
        'Figures in the app today: '+M.index.name+' '+sg(M.index.move)+'%. Sectors (share of index, move): '+M.sectors.map(function(s){return s.name+' '+s.weight+'%, '+sg(s.move)+'%';}).join('; ')+'.\n'+
        (L.tutorContext?L.tutorContext+'\n':'')+
        'Style: plain, warm, precise. Under 100 words. One idea at a time. No headings, lists or markdown. If you use an analogy, also state the real idea.\n'+
        'Boundary: explain how markets work. Never recommend buying, selling or holding anything, and never predict prices. If asked, say kindly that you can explain how to think about it but not what to do.';
    }
    function bubble(cls,text){ var d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; $('chat').appendChild(d); $('chat').scrollTop=$('chat').scrollHeight; return d; }
    function send(text){
      text=(text||'').trim(); if(!text||busy) return;
      $('starters').style.display='none';
      bubble('me',text); history.push({role:'user',content:text});
      var out=bubble('tu wait','Thinking…'); busy=true; $('tSend').disabled=true;
      var done=function(t){ out.classList.remove('wait'); out.textContent=t; history.push({role:'assistant',content:t}); busy=false; $('tSend').disabled=false; $('chat').scrollTop=$('chat').scrollHeight; };
      if(!sample){ setTimeout(function(){ done('In the live app I’d answer this using the concept you’re on — “'+C[Math.min(cur,N-1)].title+'”. Here in the preview I can only show how the conversation will look.'); },500); return; }
      var msgs=[{role:'user',content:sys()+'\n\nReply "Ready." to confirm.'},{role:'assistant',content:'Ready.'}].concat(history.slice(-10));
      sample(msgs,{cache:false,modelTier:'quick',onText:function(p){ if(p.text){ out.classList.remove('wait'); out.textContent=p.text; $('chat').scrollTop=$('chat').scrollHeight; } }})
        .then(function(r){ done(r.text); })
        .catch(function(err){ done(err&&err.code==='rate_limited'?'Lots of questions at once — give it a moment and ask again.':'The tutor couldn’t answer just now. Try asking again.'); });
    }
    function openTutor(q){
      $('tScrim').classList.add('open'); $('tSheet').classList.add('open'); $('tSheet').setAttribute('aria-hidden','false');
      if(q) send(q); else setTimeout(function(){ $('tInput').focus(); },300);
    }
    function closeTutor(){ $('tScrim').classList.remove('open'); $('tSheet').classList.remove('open'); $('tSheet').setAttribute('aria-hidden','true'); }
    $('tutorBtn').addEventListener('click',function(){ openTutor(); });
    $('tClose').addEventListener('click',closeTutor); $('tScrim').addEventListener('click',closeTutor);
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeTutor(); });
    $('starters').addEventListener('click',function(e){ var a=e.target.closest('.ask'); if(a) send(a.dataset.q); });
    $('tSend').addEventListener('click',function(){ var v=$('tInput').value; $('tInput').value=''; send(v); });
    $('tInput').addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); $('tSend').click(); } });
  }
})();
</script>

</body>
</html>
